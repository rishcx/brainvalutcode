name = "brain-agent"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
# Core uses web-standard APIs only; do NOT enable nodejs_compat.
compatibility_flags = []

[[d1_databases]]
binding = "DB"
database_name = "brain-agent"
# Paste the id printed by `npx wrangler d1 create brain-agent`.
database_id = "979d0283-e336-4ba2-b4a7-0cd91a76b34d"
migrations_dir = "migrations"

[triggers]
# One cron drives every job; the `jobs` table decides what is actually due.
crons = ["* * * * *"] # every minute; the jobs table decides what is actually due, so short reminders can fire on time

# Non-secret values only. Secrets are set with `npx wrangler secret put <NAME>`:
#   GITHUB_TOKEN_READ  GITHUB_TOKEN_VAULT  ADMIN_TOKEN  OPENROUTER_KEY
#   TELEGRAM_TOKEN  TELEGRAM_WEBHOOK_SECRET  TELEGRAM_WEBHOOK_PATH
#   WHATSAPP_TOKEN  WHATSAPP_PHONE_ID  WHATSAPP_APP_SECRET  WHATSAPP_VERIFY_TOKEN
#   GMAIL_CLIENT_ID  GMAIL_CLIENT_SECRET  GMAIL_REFRESH_TOKEN
[vars]
VAULT_REPO = "rishcx/brain-vault"
VAULT_BRANCH = "main"
# Phone editor at /login and /edit. Keep "0" until site/README.md step 6; every /login and /edit route then 404s.
EDIT_ENABLED = "0"
# Same shape as brain.config.json. Keep the local (omniroute) entry out of here: the
# Worker drops it anyway, but there is no reason to ship it.
